name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  self-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # An Arch container for vercmp: version ordering has to be decided by
      # the same comparator pacman uses on users' machines.
      - name: Run self-tests
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm jq nodejs
              ./bin/sync-upstream self-test
              ./bin/omarchy-pkgs self-test
              ./bin/omarchy-release self-test
              useradd --create-home test-runner
              runuser -u test-runner -- ./test/audit-package-architecture-test.sh
              runuser -u test-runner -- ./test/aarch64-support-test.sh
            '
